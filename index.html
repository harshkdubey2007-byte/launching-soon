<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<style>
  @font-face { font-family: "Poppins"; font-weight: 400; font-display: swap; src: url("fonts/poppins-400.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 600; font-display: swap; src: url("fonts/poppins-600.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 800; font-display: swap; src: url("fonts/poppins-800.ttf") format("truetype"); }
  :root {
    --navy: #002970;        /* Paytm navy */
    --navy-dark: #00194a;
    --sky: #00baf2;         /* Paytm sky blue */
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: "Poppins", "Segoe UI", system-ui, Arial, sans-serif;
    background: var(--white);
    color: var(--navy);
    text-align: center;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 1280px; }

  /* Scene */
  .scene { position: relative; width: fit-content; max-width: 100%; margin: 0 auto clamp(80px, 10vw, 125px); }
  /* scene height is capped so the scene and the timer both fit on one screen */
  .scene svg { display: block; aspect-ratio: 800 / 456; height: min(57vw, calc(100vh - 200px), 730px); width: auto; max-width: 100%; }
  .headline {
    position: absolute;
    top: 0; right: 6%;
    text-align: right;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1;
  }
  .headline small {
    display: block;
    font-size: clamp(.65rem, 2.2vw, 1.8rem);
    font-weight: 600;
    letter-spacing: .3em;
    color: var(--sky);
    margin-bottom: 2px;
  }
  .headline strong {
    display: block;
    font-size: clamp(2rem, 9vw, 7.5rem);
    font-weight: 800;
    letter-spacing: -.01em;
    color: var(--sky);
  }

  /* SVG animation */
  .rocket { animation: shake .12s linear infinite; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(1px,-2px); } 75% { transform: translate(-1px,2px); } }
  .flame { transform-box: fill-box; transform-origin: 50% 0; animation: flicker .25s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(1.12) scaleX(.94); } }
  .star { animation: twinkle 3s ease-in-out infinite; }
  .star:nth-child(2n) { animation-delay: 1s; }
  .star:nth-child(3n) { animation-delay: 2s; }
  @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
  .cloud-a, .cloud-b { transform-box: view-box; transform-origin: 400px 440px; animation: blastL 3.6s ease-out infinite; }
  .cloud-b { animation-name: blastR; }
  .delay { animation-delay: -1.8s; }
  @keyframes blastL {
    0%   { transform: translateX(0) scale(.85); opacity: 0; }
    12%  { opacity: 1; }
    60%  { transform: translateX(-230px) scale(1.15); opacity: 0; }
    100% { transform: translateX(-230px) scale(1.15); opacity: 0; }
  }
  @keyframes blastR {
    0%   { transform: translateX(0) scale(.85); opacity: 0; }
    12%  { opacity: 1; }
    60%  { transform: translateX(230px) scale(1.15); opacity: 0; }
    100% { transform: translateX(230px) scale(1.15); opacity: 0; }
  }
  .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .5; } }

  /* Timer */
  .timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    position: absolute;
    top: 93%; left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    width: min(820px, 96vw);
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky), #0072c6);
    box-shadow: 0 14px 30px rgba(0, 41, 112, .25);
    color: var(--white);
  }
  .box { padding: clamp(10px, 2vw, 16px) 4px; }
  .box + .box { border-left: 1px solid rgba(255,255,255,.35); }
  .num { font-size: clamp(1.6rem, 6vw, 3.4rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .label { margin-top: 4px; font-size: clamp(.6rem, 2vw, 1.05rem); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .done { display: none; font-size: 2rem; font-weight: 800; color: var(--sky); }
  .sub { margin: 24px auto 0; max-width: 460px; font-size: .95rem; line-height: 1.6; color: var(--navy); opacity: .75; }
  footer { margin-top: 28px; font-size: .8rem; color: var(--navy); opacity: .6; }


  /* Corner decorations */
  /* navy version of the logo, made for a white page */
  .brand { position: fixed; top: 12px; left: 24px; z-index: 5; display: block; }
  .brand img { display: block; height: clamp(60px, 8vw, 110px); width: auto; }
  .deco { position: fixed; z-index: 0; pointer-events: none; }
  .deco svg { display: block; width: 100%; height: auto; }
  .planet-l { left: 3%; bottom: 7%; width: clamp(90px, 11vw, 170px); animation: bob 6s ease-in-out infinite; }
  .planet-r { right: 3%; bottom: 12%; width: clamp(60px, 7vw, 110px); animation: bob 7s ease-in-out -2s infinite; }
  .spark-l { left: 4%; top: 22%; width: clamp(24px, 3vw, 44px); animation: twinkle 2.5s ease-in-out infinite; }
  .spark-r { right: 4%; top: 38%; width: clamp(18px, 2.2vw, 32px); animation: twinkle 3s ease-in-out -1s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(4deg); } }
  @media (max-width: 1000px) { .deco { display: none; } }
  @media (max-width: 600px) { .brand { position: static; margin-bottom: 8px; } body { flex-direction: column; } }

  @media (prefers-reduced-motion: reduce) {
    .rocket, .flame, .star, .deco, .cloud-a, .cloud-b, .ring { animation: none; }
  }
</style>
</head>
<body>
<a class="brand" href="#" aria-label="eBuddha Digitech"><img src="logo-dark.png" alt="eBuddha Digitech - Grow with trend"></a>

<div class="deco planet-l" aria-hidden="true">
  <svg viewBox="0 0 160 120">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd6ff"/><stop offset="1" stop-color="#0072c6"/></linearGradient></defs>
    <ellipse cx="80" cy="64" rx="76" ry="16" fill="none" stroke="#00baf2" stroke-width="5" opacity=".45" transform="rotate(-18 80 64)"/>
    <circle cx="80" cy="60" r="40" fill="url(#pg)"/>
    <circle cx="64" cy="48" r="7" fill="#fff" opacity=".25"/><circle cx="96" cy="74" r="10" fill="#fff" opacity=".18"/><circle cx="92" cy="46" r="4" fill="#fff" opacity=".25"/>
    <path d="M6 76 Q80 96 154 52" fill="none" stroke="#00baf2" stroke-width="5" opacity=".6" transform="rotate(-18 80 64)" stroke-dasharray="0 0"/>
  </svg>
</div>
<div class="deco planet-r" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" fill="#002970"/>
    <circle cx="36" cy="40" r="8" fill="#0a4aa8"/><circle cx="62" cy="62" r="11" fill="#0a4aa8"/><circle cx="64" cy="34" r="5" fill="#0a4aa8"/>
  </svg>
</div>
<div class="deco spark-l" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16Z" fill="#00baf2"/></svg></div>
<div class="deco spark-r" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16Z" fill="#002970"/></svg></div>

<main>
  <div class="scene">
    <svg viewBox="0 0 800 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rocket launching">
      <defs>
        <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#001a52"/>
          <stop offset=".55" stop-color="#003a9a"/>
          <stop offset="1" stop-color="#0a78d6"/>
        </linearGradient>
        <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe066"/>
          <stop offset="1" stop-color="#ffb12e"/>
        </linearGradient>
      </defs>

      <!-- dome -->
      <path d="M60 400 A340 340 0 0 1 740 400 Z" fill="url(#dome)"/>
      <circle class="ring" cx="400" cy="400" r="215" fill="none" stroke="#fff" stroke-width="1.2"/>

      <!-- stars -->
      <g fill="#fff">
        <circle class="star" cx="140" cy="300" r="1.6"/><circle class="star" cx="210" cy="190" r="1.2"/>
        <circle class="star" cx="300" cy="120" r="1.5"/><circle class="star" cx="250" cy="260" r="1.1"/>
        <circle class="star" cx="520" cy="130" r="1.3"/><circle class="star" cx="600" cy="200" r="1.6"/>
        <circle class="star" cx="660" cy="290" r="1.2"/><circle class="star" cx="560" cy="300" r="1.1"/>
        <circle class="star" cx="180" cy="350" r="1.3"/><circle class="star" cx="690" cy="350" r="1.5"/>
        <circle class="star" cx="340" cy="210" r="1"/><circle class="star" cx="470" cy="200" r="1.2"/>
      </g>

      <!-- launch tower -->
      <g stroke="#0b1b3a" stroke-width="5" stroke-linecap="round">
        <line x1="364" y1="365" x2="364" y2="455"/>
        <line x1="436" y1="365" x2="436" y2="455"/>
        <line x1="364" y1="390" x2="380" y2="405"/><line x1="436" y1="390" x2="420" y2="405"/>
        <line x1="364" y1="420" x2="380" y2="435"/><line x1="436" y1="420" x2="420" y2="435"/>
      </g>

      <!-- rocket -->
      <g class="rocket">
        <!-- flame -->
        <path class="flame" d="M372 366 L428 366 L418 425 L400 455 L382 425 Z" fill="url(#fire)"/>
        <!-- boosters -->
        <rect x="322" y="215" width="22" height="115" rx="11" fill="#f1f4ff"/>
        <rect x="456" y="215" width="22" height="115" rx="11" fill="#f1f4ff"/>
        <!-- fins -->
        <path d="M352 285 L302 340 Q296 356 312 356 L352 356 Z" fill="#00baf2"/>
        <path d="M448 285 L498 340 Q504 356 488 356 L448 356 Z" fill="#00baf2"/>
        <!-- body -->
        <path d="M400 125 C434 125 452 190 452 255 L452 345 Q452 358 440 358 L360 358 Q348 358 348 345 L348 255 C348 190 366 125 400 125 Z" fill="#ffffff"/>
        <path d="M430 150 C446 190 452 225 452 262 L452 345 Q452 358 440 358 L420 358 Q432 340 432 300 C432 230 428 185 418 150 Z" fill="#dfe6fb"/>
        <!-- smile -->
        <path d="M380 188 Q400 170 420 188" fill="none" stroke="#002970" stroke-width="5" stroke-linecap="round"/>
        <!-- window -->
        <circle cx="400" cy="252" r="22" fill="#00baf2"/>
        <circle cx="400" cy="252" r="16" fill="#fff" opacity=".18"/>
        <path d="M392 262 V246 M400 262 V240 M408 262 V250" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <!-- base band -->
        <rect x="348" y="346" width="104" height="14" rx="3" fill="#00baf2"/>
      </g>

      <!-- clouds (white, in front) -->
      <g fill="#fff">
        <g class="cloud-a">
          <circle cx="95" cy="415" r="52"/><circle cx="175" cy="408" r="46"/>
          <circle cx="262" cy="425" r="42"/><circle cx="335" cy="440" r="36"/>
        </g>
        <g class="cloud-b">
          <circle cx="705" cy="415" r="52"/><circle cx="625" cy="408" r="46"/>
          <circle cx="538" cy="425" r="42"/><circle cx="465" cy="440" r="36"/>
        </g>
        <g class="cloud-a delay">
          <circle cx="95" cy="415" r="52"/><circle cx="175" cy="408" r="46"/>
          <circle cx="262" cy="425" r="42"/><circle cx="335" cy="440" r="36"/>
        </g>
        <g class="cloud-b delay">
          <circle cx="705" cy="415" r="52"/><circle cx="625" cy="408" r="46"/>
          <circle cx="538" cy="425" r="42"/><circle cx="465" cy="440" r="36"/>
        </g>
        <circle cx="400" cy="462" r="40"/><circle cx="350" cy="455" r="30"/><circle cx="452" cy="455" r="30"/>
        <rect x="0" y="440" width="800" height="16"/>
      </g>
    </svg>

    <div class="headline"><small>Very Soon</small><strong>Launching</strong></div>

    <div class="timer" id="timer" aria-live="off">
      <div class="box"><div class="num" id="d">04</div><div class="label">Days</div></div>
      <div class="box"><div class="num" id="h">00</div><div class="label">Hours</div></div>
      <div class="box"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
      <div class="box"><div class="num" id="s">00</div><div class="label">Seconds</div></div>
    </div>
  </div>

  <div class="done" id="done">We're live! 🎉</div>

  <footer>&copy; 2026 eBuddha Digitech. All rights reserved.</footer>
</main>

<script>
  // 4-day countdown. The end time is saved so a page refresh doesn't restart it.
  var DURATION = 4 * 24 * 60 * 60 * 1000;
  var KEY = "comingSoonEnd";
  var end;
  try { end = parseInt(localStorage.getItem(KEY), 10); } catch (e) {}
  if (!end) {
    end = Date.now() + DURATION;
    try { localStorage.setItem(KEY, end); } catch (e) {}
  }

  var pad = function (n) { return String(n).padStart(2, "0"); };

  function tick() {
    var left = Math.max(0, end - Date.now());
    document.getElementById("d").textContent = pad(Math.floor(left / 86400000));
    document.getElementById("h").textContent = pad(Math.floor(left / 3600000) % 24);
    document.getElementById("m").textContent = pad(Math.floor(left / 60000) % 60);
    document.getElementById("s").textContent = pad(Math.floor(left / 1000) % 60);
    if (left === 0) {
      document.getElementById("timer").style.display = "none";
      document.getElementById("done").style.display = "block";
      clearInterval(id);
    }
  }
  var id = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
