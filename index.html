<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Under Maintenance</title>
<style>
  @font-face { font-family: "Poppins"; font-weight: 400; font-display: swap; src: url("fonts/poppins-400.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 600; font-display: swap; src: url("fonts/poppins-600.ttf") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 800; font-display: swap; src: url("fonts/poppins-800.ttf") format("truetype"); }
  :root {
    --navy: #002970;        /* Paytm navy */
    --navy-dark: #00194a;
    --sky: #00baf2;         /* Paytm sky blue */
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: "Poppins", "Segoe UI", system-ui, Arial, sans-serif;
    background: var(--white);
    color: var(--navy);
    text-align: center;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 1280px; }

  /* Scene */
  .scene { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
  /* scene height is capped so the scene and the timer both fit on one screen */
  .scene svg { display: block; aspect-ratio: 800 / 456; height: min(57vw, calc(100vh - 290px), 730px); width: auto; max-width: 100%; }
  .headline {
    position: absolute;
    top: 0; right: 6%;
    text-align: right;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1;
  }
  .headline small {
    display: block;
    font-size: clamp(.65rem, 2.2vw, 1.8rem);
    font-weight: 600;
    letter-spacing: .3em;
    color: var(--sky);
    margin-bottom: 2px;
  }
  .headline strong {
    display: block;
    font-size: clamp(1.5rem, 6vw, 5rem);
    font-weight: 800;
    letter-spacing: -.01em;
    color: var(--sky);
  }

  /* SVG animation */
  .gear { transform-box: view-box; animation: spin 10s linear infinite; }
  .gear.rev { animation-direction: reverse; animation-duration: 6.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gear { transform-box: fill-box; transform-origin: 50% 50%; }
  .bar { transform-box: fill-box; transform-origin: 0 50%; animation: load 4s ease-in-out infinite; }
  @keyframes load { 0% { transform: scaleX(.1); } 70%,100% { transform: scaleX(.72); } }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(1px,-2px); } 75% { transform: translate(-1px,2px); } }
  .flame { transform-box: fill-box; transform-origin: 50% 0; animation: flicker .25s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(1.12) scaleX(.94); } }
  .star { animation: twinkle 3s ease-in-out infinite; }
  .star:nth-child(2n) { animation-delay: 1s; }
  .star:nth-child(3n) { animation-delay: 2s; }
  @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
  .cloud-a, .cloud-b { transform-box: view-box; transform-origin: 400px 440px; animation: blastL 3.6s ease-out infinite; }
  .cloud-b { animation-name: blastR; }
  .delay { animation-delay: -1.8s; }
  @keyframes blastL {
    0%   { transform: translateX(0) scale(.85); opacity: 0; }
    12%  { opacity: 1; }
    60%  { transform: translateX(-230px) scale(1.15); opacity: 0; }
    100% { transform: translateX(-230px) scale(1.15); opacity: 0; }
  }
  @keyframes blastR {
    0%   { transform: translateX(0) scale(.85); opacity: 0; }
    12%  { opacity: 1; }
    60%  { transform: translateX(230px) scale(1.15); opacity: 0; }
    100% { transform: translateX(230px) scale(1.15); opacity: 0; }
  }
  .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .5; } }

  /* Timer */
  .timer {
    position: relative;
    z-index: 3;
    width: min(820px, 96vw);
    margin: calc(-1 * clamp(22px, 5vw, 60px)) auto 0;
    padding: clamp(12px, 2.4vw, 20px) clamp(10px, 2vw, 20px);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--sky), #0072c6);
    box-shadow: 0 14px 30px rgba(0, 41, 112, .25);
    color: var(--white);
  }
  .when { font-size: clamp(1.05rem, 4.6vw, 2.4rem); font-weight: 700; line-height: 1.15; }
  .when span { white-space: nowrap; }
  .cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.6vw, 14px); margin: clamp(10px, 2vw, 16px) 0; }
  .box { padding: clamp(6px, 1.4vw, 10px) 2px; border-radius: 10px; background: rgba(0, 41, 112, .28); }
  .num { font-size: clamp(1.4rem, 6vw, 3rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .label { margin-top: 2px; font-size: clamp(.55rem, 2vw, .9rem); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .msg { font-size: clamp(.6rem, 2.3vw, 1.05rem); letter-spacing: .1em; text-transform: uppercase; opacity: .95; line-height: 1.4; }
  .done { display: none; font-size: 2rem; font-weight: 800; color: var(--sky); }
  .sub { margin: 24px auto 0; max-width: 460px; font-size: .95rem; line-height: 1.6; color: var(--navy); opacity: .75; }
  footer { margin-top: 20px; font-size: .8rem; color: var(--navy); opacity: .6; }


  /* Corner decorations */
  /* navy version of the logo, made for a white page */
  .brand { position: fixed; top: 12px; left: 24px; z-index: 5; display: block; }
  .brand img { display: block; height: clamp(60px, 8vw, 110px); width: auto; }
  .deco { position: fixed; z-index: 0; pointer-events: none; }
  .deco svg { display: block; width: 100%; height: auto; }
  .planet-l { left: 3%; bottom: 7%; width: clamp(90px, 11vw, 170px); animation: bob 6s ease-in-out infinite; }
  .planet-r { right: 3%; bottom: 12%; width: clamp(60px, 7vw, 110px); animation: bob 7s ease-in-out -2s infinite; }
  .spark-l { left: 4%; top: 22%; width: clamp(24px, 3vw, 44px); animation: twinkle 2.5s ease-in-out infinite; }
  .spark-r { right: 4%; top: 38%; width: clamp(18px, 2.2vw, 32px); animation: twinkle 3s ease-in-out -1s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(4deg); } }
  @media (max-width: 1000px) { .deco { display: none; } }
  .wa { display: flex; align-items: center; justify-content: center; gap: 10px; width: fit-content; max-width: 100%; margin: 18px auto 0; padding: 14px 18px; border-radius: 14px; background: #25d366; color: #fff; font-weight: 600; font-size: 1.05rem; text-decoration: none; box-shadow: 0 10px 22px rgba(37, 211, 102, .35); }
  .wa svg { width: 26px; height: 26px; }
  .wa:active { transform: scale(.98); }
  @media (max-width: 600px) {
    .wa { width: 100%; margin-top: 16px; }
    body { flex-direction: column; justify-content: flex-start; padding: 12px 12px max(16px, env(safe-area-inset-bottom)); min-height: 100dvh; }
    .brand { position: static; margin: 4px auto 0; }
    .brand img { height: 64px; }
    .scene { width: 100%; display: flex; flex-direction: column; }
    .scene svg { height: auto; width: 100%; margin-top: -14%; }
    .headline { position: static; order: -1; text-align: center; margin: 8px 0 10px; }
    .headline strong { font-size: clamp(2rem, 11vw, 2.8rem); line-height: 1.02; }
    .timer { width: 100%; margin-top: -26px; padding: 14px 10px; }
    .when { font-size: 1.15rem; }
    .num { font-size: 1.7rem; }
    .label { font-size: .62rem; }
    .msg { font-size: .7rem; letter-spacing: .06em; }
    footer { margin-top: 16px; font-size: .72rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gear, .bar, .star, .deco, .cloud-a, .cloud-b, .ring { animation: none; }
  }
</style>
</head>
<body>
<a class="brand" href="#" aria-label="eBuddha Digitech"><img src="logo-dark.png" alt="eBuddha Digitech - Grow with trend"></a>

<div class="deco planet-l" aria-hidden="true">
  <svg viewBox="0 0 160 120">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd6ff"/><stop offset="1" stop-color="#0072c6"/></linearGradient></defs>
    <ellipse cx="80" cy="64" rx="76" ry="16" fill="none" stroke="#00baf2" stroke-width="5" opacity=".45" transform="rotate(-18 80 64)"/>
    <circle cx="80" cy="60" r="40" fill="url(#pg)"/>
    <circle cx="64" cy="48" r="7" fill="#fff" opacity=".25"/><circle cx="96" cy="74" r="10" fill="#fff" opacity=".18"/><circle cx="92" cy="46" r="4" fill="#fff" opacity=".25"/>
    <path d="M6 76 Q80 96 154 52" fill="none" stroke="#00baf2" stroke-width="5" opacity=".6" transform="rotate(-18 80 64)" stroke-dasharray="0 0"/>
  </svg>
</div>
<div class="deco planet-r" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" fill="#002970"/>
    <circle cx="36" cy="40" r="8" fill="#0a4aa8"/><circle cx="62" cy="62" r="11" fill="#0a4aa8"/><circle cx="64" cy="34" r="5" fill="#0a4aa8"/>
  </svg>
</div>
<div class="deco spark-l" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16Z" fill="#00baf2"/></svg></div>
<div class="deco spark-r" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16Z" fill="#002970"/></svg></div>

<main>
  <div class="scene">
    <svg viewBox="0 0 800 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gears turning: site under maintenance">
      <defs>
        <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#001a52"/><stop offset=".55" stop-color="#003a9a"/><stop offset="1" stop-color="#0a78d8"/>
        </linearGradient>
        <linearGradient id="gearg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd6ff"/><stop offset="1" stop-color="#00baf2"/></linearGradient>
        <clipPath id="clip"><path d="M60 440 A340 340 0 0 1 740 440 Z"/></clipPath>
        <pattern id="hazard" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="40" height="40" fill="#ffd54f"/><rect width="20" height="40" fill="#002970"/>
        </pattern>
      </defs>
      <path d="M60 440 A340 340 0 0 1 740 440 Z" fill="url(#dome)"/>
      <g clip-path="url(#clip)">
        <circle class="ring" cx="400" cy="440" r="230" fill="none" stroke="#fff" stroke-opacity=".3"/>
        <g fill="#fff"><circle class="star" cx="170" cy="260" r="2"/><circle class="star" cx="250" cy="140" r="1.5"/><circle class="star" cx="620" cy="170" r="2"/><circle class="star" cx="680" cy="300" r="1.5"/><circle class="star" cx="560" cy="110" r="1.5"/></g>

        <!-- big gear -->
        <g transform="translate(330 285)">
          <g class="gear">
            <circle r="76" fill="none" stroke="url(#gearg)" stroke-width="26" stroke-dasharray="26.7 26.7"/>
            <circle r="66" fill="url(#gearg)"/>
            <circle r="26" fill="#002970"/><circle r="12" fill="#fff"/>
            <g stroke="#002970" stroke-width="7" stroke-linecap="round" opacity=".35"><path d="M0 -60V-34M52 -30L30 -17M52 30L30 17M0 60V34M-52 30L-30 17M-52 -30L-30 -17"/></g>
          </g>
        </g>
        <!-- small gear -->
        <g transform="translate(468 232)">
          <g class="gear rev">
            <circle r="46" fill="none" stroke="#fff" stroke-width="18" stroke-dasharray="18 18"/>
            <circle r="40" fill="#fff"/>
            <circle r="16" fill="#002970"/><circle r="7" fill="#00baf2"/>
          </g>
        </g>
        <!-- tiny gear -->
        <g transform="translate(540 330)">
          <g class="gear">
            <circle r="27" fill="none" stroke="#00baf2" stroke-width="11" stroke-dasharray="11 11"/>
            <circle r="24" fill="#00baf2"/><circle r="9" fill="#002970"/>
          </g>
        </g>
        <!-- progress bar -->
        <g transform="translate(250 395)">
          <rect width="300" height="14" rx="7" fill="#fff" fill-opacity=".2"/>
          <rect class="bar" width="300" height="14" rx="7" fill="#00baf2"/>
        </g>
        <!-- hazard tape -->
        <rect x="0" y="418" width="800" height="22" fill="url(#hazard)"/>
      </g>
      <!-- sparks -->
      <g fill="#ffd54f"><path class="star" d="M600 120l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path class="star" d="M190 190l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
    </svg>

    <div class="headline"><strong>Under<br>Maintenance</strong></div>

    <div class="timer">
      <div class="when">3 November 2026, <span>12:00 PM</span></div>
      <div class="cd" id="cd" aria-live="off">
        <div class="box"><div class="num" id="d">00</div><div class="label">Days</div></div>
        <div class="box"><div class="num" id="h">00</div><div class="label">Hours</div></div>
        <div class="box"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
        <div class="box"><div class="num" id="s">00</div><div class="label">Seconds</div></div>
      </div>
      <div class="msg">Coming back with some extraordinary gift for you guys</div>
    </div>
  </div>

  <a class="wa" href="https://wa.me/918461958162" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.9 9.9 0 0 0-8.5 14.95L2 22l5.2-1.5A9.94 9.94 0 1 0 12.04 2zm0 18.1c-1.5 0-2.95-.4-4.2-1.15l-.3-.18-3.1.9.9-3-.2-.3a8.1 8.1 0 1 1 6.9 3.73zm4.45-6.05c-.25-.12-1.45-.72-1.68-.8-.23-.08-.4-.12-.56.12-.17.25-.65.8-.8.96-.15.17-.3.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.1-.5.12-.11.25-.3.37-.45.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.45-.59 1.65-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.17-.47-.29z"/></svg>
    Chat on WhatsApp
  </a>

  <footer>&copy; 2026 eBuddha Digitech. All rights reserved.</footer>
</main>

<script>
  // Counts down to 3 Nov 2026, 12:00 PM (visitor's local time).
  var end = new Date(2026, 10, 3, 12, 0, 0).getTime();
  var pad = function (n) { return String(n).padStart(2, "0"); };
  function tick() {
    var left = Math.max(0, end - Date.now());
    document.getElementById("d").textContent = pad(Math.floor(left / 86400000));
    document.getElementById("h").textContent = pad(Math.floor(left / 3600000) % 24);
    document.getElementById("m").textContent = pad(Math.floor(left / 60000) % 60);
    document.getElementById("s").textContent = pad(Math.floor(left / 1000) % 60);
    if (left === 0) clearInterval(id);
  }
  var id = setInterval(tick, 1000);
  tick();
</script>

</body>
</html>
